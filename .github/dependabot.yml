version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      microsoft:
        patterns: ["Microsoft.*", "Npgsql*", "EFCore.*"]
      pruebas:
        patterns: ["xunit*", "Shouldly", "FsCheck*", "Testcontainers*"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      front:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
